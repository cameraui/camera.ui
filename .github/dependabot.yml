version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/server"
      - "/service"
      - "/ui"
    schedule:
      interval: weekly
      day: monday
    # let a release age first, security updates ignore this
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "eslint"
      - dependency-name: "typescript"

  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/server"
    schedule:
      interval: weekly
      day: monday
    # let a release age first, security updates ignore this
    cooldown:
      default-days: 7
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
